services:
  relay:
    environment:
      RELAY_ORIGIN: "https://${RELAY_DOMAIN:?Set RELAY_DOMAIN to your public hostname}"
      RELAY_TRUST_PROXY_IP: "true"
  caddy:
    image: caddy:2.11.4
    network_mode: host
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN:?Set RELAY_DOMAIN to your public hostname}"
      RELAY_PORT: "${RELAY_PORT:-8787}"
    volumes:
      - ./deploy/portable/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
