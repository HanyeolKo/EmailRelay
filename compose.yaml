name: emailrelay
services:
  relay:
    build: .
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 1m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      RELAY_DATA: /data/emailrelay
      RELAY_LISTEN: "127.0.0.1:${RELAY_PORT:-8787}"
      RELAY_ORIGIN: "${RELAY_ORIGIN:-http://localhost:${RELAY_PORT:-8787}}"
      RELAY_TRUST_PROXY_IP: "${RELAY_TRUST_PROXY_IP:-false}"
      RELAY_INTERVAL: "${RELAY_INTERVAL:-1m}"
      RELAY_MAX_MIB: "${RELAY_MAX_MIB:-32}"
      RELAY_ALLOWED_CIDRS: "${RELAY_ALLOWED_CIDRS:-}"
    volumes:
      - relay-data:/data

volumes:
  relay-data:
